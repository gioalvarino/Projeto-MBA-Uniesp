name: Teste de autenticação GCP

# Workflow temporário só para validar que o secret GCP_SA_KEY autentica
# corretamente no BigQuery (service account github-actions, com os papéis
# BigQuery Data Editor + BigQuery Job User). Rodar manualmente uma vez
# depois de criar/atualizar o secret; pode ser removido quando o pipeline
# real (dbt build, em pipeline.yml) já fizer essa mesma verificação.

on:
  workflow_dispatch: {}

jobs:
  testar-autenticacao:
    runs-on: ubuntu-latest
    steps:
      - name: Autenticar no GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Configurar gcloud CLI
        uses: google-github-actions/setup-gcloud@v2

      - name: Listar datasets do BigQuery (confirma autenticação + permissões)
        run: |
          bq ls --project_id=projeto-mba-uniesp
