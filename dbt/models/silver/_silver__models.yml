version: 2

models:
  - name: stg_pni__doses_aplicadas
    description: >
      Uma linha por dose aplicada, depois de deduplicar por
      `codigo_documento` e remover os registros excluídos na origem
      (`data_deletado_rnds`). Ver docs/dicionario_dados.md para as regras de
      qualidade conhecidas.
    columns:
      - name: codigo_documento
        description: Chave única após a deduplicação.
        tests:
          - unique
          - not_null

      - name: data_vacina
        description: Data do evento, já convertida para DATE.
        tests:
          - not_null

      - name: idade_paciente
        description: >
          Idade em anos. 0 é bebê com menos de 1 ano (não é nulo/faltante).

      - name: status_documento
        description: >
          Confirmado só "final" no dado real de fev/2026 (8,9M linhas,
          22/08/2026).
        tests:
          - accepted_values:
              arguments:
                values: ["final"]
              config:
                # Continua warn (não error): só validamos 1 dos 7 meses até
                # agora. Promover pra error quando os outros meses também
                # confirmarem.
                severity: warn
