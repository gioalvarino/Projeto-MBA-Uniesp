version: 2

models:
  - name: stg_pni__doses_aplicadas
    description: >
      Uma linha por dose aplicada, depois de deduplicar por
      `codigo_documento` e remover os registros excluídos na origem
      (`data_deletado_rnds`). Ver docs/dicionario_dados.md para as regras de
      qualidade conhecidas.
    columns:
      - name: codigo_documento
        description: Chave única após a deduplicação.
        tests:
          - unique
          - not_null

      - name: data_vacina
        description: Data do evento, já convertida para DATE.
        tests:
          - not_null

      - name: idade_paciente
        description: >
          Idade em anos. 0 é bebê com menos de 1 ano (não é nulo/faltante).

      - name: municipio_cobertura
        description: >
          Código IBGE resolvido pro cálculo de cobertura (ADR 0007):
          residência quando disponível, aplicação como fallback, nulo
          quando estrangeiro ou sem informação de país.

      - name: uf_cobertura
        description: >
          UF resolvida pro cálculo de cobertura (ADR 0007): residência,
          aplicação (fallback), UF derivada do código do município (seed
          uf_ibge) quando a sigla vem vazia na fonte, 'ESTRANGEIRO' ou
          'SEM INFORMACAO'.
        tests:
          # Error (não warn): a estrutura do CASE + COALESCE final sempre
          # preenche um valor — se isso falhar, é sinal de um caminho novo
          # não coberto (ex.: prefixo de código de município fora da tabela
          # uf_ibge), não de dado real vazio.
          - not_null

      - name: raca_cor_cobertura
        description: >
          Código de raça/cor padronizado (adendo ADR 0008, 23/08/2026):
          co_raca_cor_paciente direto, com nulo (4 casos em ~115M linhas)
          caindo em '99' — mesmo código que a fonte já usa pra "sem
          informação" explícito.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["01", "02", "03", "04", "05", "99"]

      - name: nome_raca_cor_cobertura
        description: >
          Nome de raça/cor já vem pronto da fonte (no_raca_cor_paciente) —
          sem de-para externo pendente, diferente de vacina/dose/estratégia.
        tests:
          - not_null

      - name: sexo_cobertura
        description: >
          Sexo padronizado (adendo ADR 0008, 23/08/2026): 'F'/'M' direto da
          fonte (tp_sexo_paciente); 'I' (Ignorado, 1.827 casos nos 7 meses
          reais) e 'N' (2 casos, provável erro de digitação da fonte) caem
          em 'SEM INFORMACAO' — nenhum registro chegou nulo de fato.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["F", "M", "SEM INFORMACAO"]

      - name: estrategia_cobertura
        description: >
          Código de estratégia de vacinação padronizado (adendo ADR 0008,
          23/08/2026): co_estrategia_vacinacao direto, nulo (~686k de ~115M
          linhas, ~0,6%) caindo em 'SEM INFORMACAO'.
        tests:
          - not_null

      - name: nome_vacina_cobertura
        description: >
          Nome da vacina já vem pronto na fonte (ds_nome) — achado real,
          23/08/2026, ao conectar o Power BI. Sem de-para externo pendente.
        tests:
          - not_null

      - name: nome_dose_cobertura
        description: >
          Nome da dose já vem pronto na fonte (ds_tipo_dose) — mesmo
          achado real de nome_vacina_cobertura.
        tests:
          - not_null

      - name: nome_estrategia_cobertura
        description: >
          Nome da estratégia de vacinação já vem pronto na fonte
          (no_estrategia) — mesmo achado real. Código '0' e nulo também não
          têm nome na fonte, caem em 'SEM INFORMACAO' junto com o código.
        tests:
          - not_null
