version: 2

models:
  - name: stg_ibge__municipios
    description: >
      Enriquecimento com Base dos Dados/IBGE (ADR 0004 + ADR 0009,
      23/08/2026): nome e população por município. População usa a
      estimativa mais recente disponível com valor preenchido até 2025,
      não exatamente 2025 (achado real: Boa Esperança do Norte/MT sem
      valor pra 2025 — ver ADR 0009). id_municipio_6d é a chave real de
      join com a silver do PNI (achado real, mesmo dia — código de 6
      dígitos, não 7 — ver 2º refinamento do ADR 0009). Fonte externa, não
      versionada por nós.
    columns:
      - name: id_municipio
        description: Código IBGE do município (7 dígitos, com dígito verificador).
        tests:
          - unique
          - not_null

      - name: id_municipio_6d
        description: >
          Código de 6 dígitos (id_municipio sem o dígito verificador) — é
          esse formato que municipio_cobertura usa na silver (achado real,
          23/08/2026 — ver 2º refinamento do ADR 0009). Chave usada no join
          com dim_municipio, não id_municipio.
        tests:
          - unique
          - not_null

      - name: nome_municipio
        tests:
          - not_null

      - name: populacao
        description: >
          Estimativa populacional mais recente disponível (até 2025) por
          município. Pode ficar nula se um município não tiver NENHUM ano
          com valor preenchido na Base dos Dados — checar se acontecer.
        tests:
          - not_null:
              config:
                severity: warn

      - name: ano_populacao
        description: >
          De qual ano veio a estimativa de populacao usada (nem sempre
          2025) — transparência pra apresentação/Power BI.
