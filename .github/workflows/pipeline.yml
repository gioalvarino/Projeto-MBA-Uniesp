name: Pipeline dbt

# Este workflow roda o dbt (transformação), não a ingestão — os CSVs
# mensais são baixados e carregados manualmente com
# `ingestion/load_pni_csv.py` (ver ADR 0002 sobre por que a ingestão não é
# automatizada ainda: falta uma URL estável de download por mês).
#
# Atualizado em 26/08/2026 (ver adendo do ADR 0006): até aqui este job só
# rodava `dbt debug` + `dbt compile` — placeholder de quando a bronze
# ainda não tinha dado carregado. Com os 7 meses reais já na bronze, isso
# tinha uma consequência não percebida: ninguém do trio conseguia ver as
# tabelas gold, porque só a service account deste workflow (target `ci`)
# tem permissão de escrita nos datasets compartilhados silver/gold (ADR
# 0006) — e este job nunca tinha rodado um `dbt build` de verdade. Cada
# `dbt build` local só escreve no dev_<nome> de quem rodou, por desenho.
#
# Agora roda `dbt build` de verdade — é o único jeito de publicar no
# silver/gold compartilhado, pra Ellen e Andressa também enxergarem as
# tabelas (inclusive a `mart_cobertura_vacinal` nova, usada pelo Looker
# Studio). Gatilho por agendamento diário removido de propósito: não há
# mais carga nova prevista antes da apresentação (29/08), e cada run
# processa uma consulta real (com custo, ainda que pequeno e limitado por
# maximum_bytes_billed) — rodar todo dia sem necessidade vai contra a
# regra do projeto de reduzir ao máximo consultas que geram cobrança.
# Ficou só o botão manual (workflow_dispatch, aba Actions do GitHub).
#
# Atualizado em 26/08/2026 (2): a primeira run real (#8) falhou — dois
# testes not_null na silver precisaram de ~10 GB e ~14,14 GB, estourando
# o limite de maximum_bytes_billed de 10 GB deste profile `ci`. Como um
# teste falho derruba (SKIP) tudo que depende dele, isso zerou a
# publicação das 7 tabelas gold nessa run. Subido para 20 GB abaixo —
# o mesmo ajuste já feito no profile `dev` em 23/08 pelo motivo idêntico.

on:
  workflow_dispatch: {}

jobs:
  dbt-build:
    runs-on: ubuntu-latest
    env:
      GCP_PROJECT: projeto-mba-uniesp
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Preparar credenciais do GCP (arquivo temporário, só nesta run)
        run: echo "$GCP_SA_KEY_JSON" > "$RUNNER_TEMP/gcp-sa-key.json"
        env:
          GCP_SA_KEY_JSON: ${{ secrets.GCP_SA_KEY }}

      - name: Gerar profiles.yml do CI (ver dbt/profiles.yml.example e ADR 0006)
        run: |
          mkdir -p "$RUNNER_TEMP/dbt_profile"
          cat > "$RUNNER_TEMP/dbt_profile/profiles.yml" <<EOF
          projeto_pni_uniesp:
            target: ci
            outputs:
              ci:
                type: bigquery
                method: service-account
                project: ${GCP_PROJECT}
                dataset: silver
                threads: 4
                location: US
                priority: batch
                maximum_bytes_billed: 20000000000
                keyfile: "$RUNNER_TEMP/gcp-sa-key.json"
          EOF

      - name: dbt build (publica de verdade no silver/gold compartilhado)
        working-directory: dbt
        run: dbt build --profiles-dir "$RUNNER_TEMP/dbt_profile"

      - name: dbt docs generate
        run: |
          echo "TODO: dbt docs generate (depois que dbt build estiver ativo)"

      # TODO: publicar o conteúdo de dbt/target/ no GitHub Pages
      - name: Publicar dbt docs no GitHub Pages
        run: |
          echo "TODO: publicar docs no GitHub Pages"
