version: 2

models:
  - name: stg_pni__doses_aplicadas
    description: >
      Uma linha por dose aplicada, depois de deduplicar por
      `codigo_documento` e remover os registros excluídos na origem
      (`data_deletado_rnds`). Ver docs/dicionario_dados.md para as regras de
      qualidade conhecidas.
    columns:
      - name: codigo_documento
        description: Chave única após a deduplicação.
        tests:
          - unique
          - not_null

      - name: data_vacina
        description: Data do evento, já convertida para DATE.
        tests:
          - not_null

      - name: idade_paciente
        description: >
          Idade em anos. 0 é bebê com menos de 1 ano (não é nulo/faltante).

      - name: municipio_cobertura
        description: >
          Código IBGE resolvido pro cálculo de cobertura (ADR 0007):
          residência quando disponível, aplicação como fallback, nulo
          quando estrangeiro ou sem informação de país.

      - name: uf_cobertura
        description: >
          UF resolvida pro cálculo de cobertura (ADR 0007): residência,
          aplicação (fallback), UF derivada do código do município (seed
          uf_ibge) quando a sigla vem vazia na fonte, 'ESTRANGEIRO' ou
          'SEM INFORMACAO'.
        tests:
          # Error (não warn): a estrutura do CASE + COALESCE final sempre
          # preenche um valor — se isso falhar, é sinal de um caminho novo
          # não coberto (ex.: prefixo de código de município fora da tabela
          # uf_ibge), não de dado real vazio.
          - not_null

      - name: status_documento
        description: >
          Confirmado só "final" no dado real de fev/2026 (8,9M linhas,
          22/08/2026).
        tests:
          - accepted_values:
              arguments:
                values: ["final"]
              config:
                # Continua warn (não error): só validamos 1 dos 7 meses até
                # agora. Promover pra error quando os outros meses também
                # confirmarem.
                severity: warn
