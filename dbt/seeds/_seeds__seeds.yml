version: 2

seeds:
  - name: uf_ibge
    description: >
      Tabela de referência fixa: 2 primeiros dígitos do código IBGE de
      município → sigla da UF. São 27 unidades (26 estados + DF) e essa
      relação nunca muda — não é um de-para pendente de confirmação como
      co_vacina/co_dose_vacina/co_estrategia_vacinacao.

      Usada em `stg_pni__doses_aplicadas` (ver ADR 0007) pra derivar
      `uf_cobertura` quando o campo de sigla vem vazio no CSV mas o
      município de cobertura é conhecido — achado em 22/08/2026 (1.162
      linhas de 8,9M no dado real de fevereiro tinham município preenchido
      e sigla de UF vazia).
    columns:
      - name: co_uf
        description: 2 primeiros dígitos do código IBGE de município.
      - name: sg_uf
        description: Sigla da UF (2 letras).
      - name: nome_uf
        description: Nome completo da UF.

  - name: faixa_etaria
    description: >
      Referência fixa de faixas etárias (ADR 0008) usada em
      `fct_cobertura_vacinal`. Fronteiras usuais de programas de
      imunização — ajustáveis aqui sem tocar em outros models. `ordem` é a
      chave usada pela fato (`chave_faixa_etaria`) e também define a ordem
      de exibição no Power BI. A linha `ordem = 0` (idade_min/idade_max
      nulos) cobre `idade_paciente` nulo.

      Coluna de rótulo renomeada de `faixa_etaria` pra `nome_faixa_etaria`
      em 23/08/2026: como o nome da coluna era igual ao nome da tabela, o
      conector do Power BI pro BigQuery mostrava essa coluna como
      `[Record]` em vez do texto (achado real ao conectar o Power BI) — o
      mesmo padrão `nome_*` já usado em `nome_mes`, `nome_vacina`,
      `nome_estrategia`, `nome_raca_cor_cobertura` evita essa colisão.
    columns:
      - name: ordem
        description: Chave da dimensão e ordem de exibição.
        tests:
          - unique
          - not_null
      - name: idade_min
        description: Idade mínima (inclusiva) da faixa, em anos. Nulo na faixa "sem informação".
      - name: idade_max
        description: Idade máxima (inclusiva) da faixa, em anos. Nulo na faixa "sem informação".
      - name: nome_faixa_etaria
        description: Rótulo da faixa, pronto pra exibir no Power BI.
        tests:
          - unique
          - not_null

  - name: meta_vacinal
    description: >
      Referência fixa das 19 vacinas do calendário infantil do PNI e sua
      meta oficial de cobertura (ADR 0010) — 95% pra maioria dos
      imunizantes, 90% pra BCG/rotavírus/HPV/influenza, 80% pra
      meningocócica ACWY. A meta é nacional única (não varia por
      estado/município — só a cobertura alcançada varia).

      IMPORTANTE (ver ADR 0010): esta tabela usa os nomes oficiais do
      calendário nacional, que NÃO batem string-a-string com
      `dim_vacina.nome_vacina`/`nome_dose` (que vêm direto do `ds_nome`
      bruto do PNI, ex.: "vacina febre amarela (atenuada)"). Ainda não
      existe join entre as duas — falta um de-para manual, igual foi feito
      pra co_vacina/co_dose_vacina, pra ligar as ~90 variações reais às 19
      linhas aqui. Por enquanto é só uma referência solta pro Power BI
      (ex.: linha de meta fixa nos gráficos), não uma dimensão ligada à
      fato.
    columns:
      - name: ordem
        description: Ordem de exibição (segue a ordem do calendário nacional).
        tests:
          - unique
          - not_null
      - name: vacina
        description: Nome oficial da vacina no calendário nacional do PNI.
        tests:
          - not_null
      - name: dose
        description: Dose/esquema a que a meta se aplica (ex. "1º reforço").
      - name: meta_cobertura
        description: Meta oficial de cobertura, fração de 0 a 1 (0.95 = 95%).
        tests:
          - not_null
