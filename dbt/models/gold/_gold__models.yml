version: 2

models:
  - name: dim_tempo
    description: >
      Dimensão de calendário gerada (ADR 0008), grão diário, cobrindo
      2026 inteiro. Não vem da fonte.
    columns:
      - name: data
        description: Chave da dimensão (mesmo valor de data_vacina na fato).
        tests:
          - unique
          - not_null

  - name: dim_municipio
    description: >
      Dimensão de município de cobertura (ADR 0007 + ADR 0008). Inclui
      membros especiais pra 'ESTRANGEIRO' e 'SEM INFORMACAO'.
      nome_municipio/populacao pendentes de enriquecimento externo.
    columns:
      - name: chave_municipio
        description: >
          municipio_cobertura quando existe, senão uf_cobertura
          ('ESTRANGEIRO'/'SEM INFORMACAO').
        tests:
          - unique
          - not_null

  - name: dim_vacina
    description: >
      Dimensão de vacina/dose (ADR 0008). nome_vacina/nome_dose pendentes
      do de-para oficial do PNI.
    columns:
      - name: chave_vacina
        description: "co_vacina || '-' || co_dose_vacina"
        tests:
          - unique
          - not_null

  - name: dim_perfil_paciente
    description: >
      Dimensão de perfil demográfico do paciente (raça/cor + sexo) — adendo
      ao ADR 0008 (23/08/2026). Grão pequeno (até 6 raças/cores x 3
      categorias de sexo padronizadas = no máximo 18 combinações). Nome de
      raça/cor já vem pronto da fonte, sem de-para externo pendente.
    columns:
      - name: chave_perfil
        description: "raca_cor_cobertura || '-' || sexo_cobertura"
        tests:
          - unique
          - not_null

  - name: dim_estrategia_vacinacao
    description: >
      Dimensão de estratégia de vacinação (rotina/campanha/bloqueio etc.) —
      adendo ao ADR 0008 (23/08/2026). Segue o mesmo padrão de dim_vacina:
      só o código por enquanto, nome_estrategia pendente do de-para oficial
      do PNI.
    columns:
      - name: chave_estrategia
        description: "estrategia_cobertura (co_estrategia_vacinacao, ou 'SEM INFORMACAO' quando nulo)"
        tests:
          - unique
          - not_null

  - name: fct_cobertura_vacinal
    description: >
      Fato de cobertura vacinal (ADR 0008 + adendos 23/08/2026). Grão
      agregado: uma linha por combinação de data_vacina + chave_municipio +
      chave_vacina + chave_faixa_etaria + chave_perfil + chave_estrategia,
      com qtd_doses como métrica. Sem dado pessoal identificável direto
      (ADR 0005) — raça/cor e sexo entram agregados, nunca ligados a um
      indivíduo.
    columns:
      - name: data_vacina
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_tempo')
                field: data

      - name: chave_municipio
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_municipio')
                field: chave_municipio

      - name: chave_vacina
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_vacina')
                field: chave_vacina

      - name: chave_faixa_etaria
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('faixa_etaria')
                field: ordem

      - name: chave_perfil
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_perfil_paciente')
                field: chave_perfil

      - name: chave_estrategia
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_estrategia_vacinacao')
                field: chave_estrategia

      - name: qtd_doses
        description: Contagem de doses aplicadas na combinação de chaves da linha.
        tests:
          - not_null
